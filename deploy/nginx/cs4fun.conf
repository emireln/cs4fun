# cs4fun — static landing, game SPA, Windows installer
# Managed with the repo; bootstrap installs to sites-available.

# --- Landing: cs4fun.online (+ www) -----------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name cs4fun.online www.cs4fun.online;

    # ACME challenges (certbot)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/cs4fun/web;
        default_type "text/plain";
        allow all;
    }

    root /var/www/cs4fun/web;
    index index.html;

    # Windows installer + update artifacts
    location /download/ {
        alias /var/www/cs4fun/download/;
        autoindex off;
        types {
            application/octet-stream exe;
            text/yaml yml yaml;
            application/octet-stream blockmap;
        }
        add_header Cache-Control "public, max-age=300" always;
        client_max_body_size 200m;
    }

    # Hashed Vite assets
    location /assets/ {
        try_files $uri =404;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
}

# --- Game: app.cs4fun.online -----------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name app.cs4fun.online;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/cs4fun/app;
        default_type "text/plain";
        allow all;
    }

    root /var/www/cs4fun/app;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
}
