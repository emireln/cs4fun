name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy-sites:
    name: Build & deploy sites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build landing
        working-directory: apps/web
        env:
          VITE_APP_URL: https://app.cs4fun.online
          VITE_WINDOWS_DOWNLOAD_URL: https://cs4fun.online/download/cs4fun-Setup.exe
        run: npm run build

      - name: Build game
        working-directory: apps/app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Setup SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?VPS_HOST secret is empty}"
          : "${VPS_PORT:?VPS_PORT secret is empty}"
          : "${VPS_SSH_KEY:?VPS_SSH_KEY secret is empty}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Rsync landing
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${VPS_PORT} -o IdentitiesOnly=yes" \
            apps/web/dist/ \
            "${VPS_USER}@${VPS_HOST}:/var/www/cs4fun/web/"

      - name: Rsync game
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${VPS_PORT} -o IdentitiesOnly=yes" \
            apps/app/dist/ \
            "${VPS_USER}@${VPS_HOST}:/var/www/cs4fun/app/"

      - name: Reload nginx
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${VPS_PORT}" -o IdentitiesOnly=yes \
            "${VPS_USER}@${VPS_HOST}" \
            "sudo nginx -t && sudo systemctl reload nginx"

  build-installer:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build Electron installer
        working-directory: apps/app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run electron:build

      - name: Prepare download artifacts
        shell: pwsh
        run: |
          $release = "apps/app/release"
          $exe = Get-ChildItem $release -Filter "cs4fun-Setup-*.exe" |
            Where-Object { $_.Name -ne "cs4fun-Setup.exe" } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $exe) { throw "No cs4fun-Setup-*.exe found in $release" }
          Copy-Item $exe.FullName (Join-Path $release "cs4fun-Setup.exe") -Force
          Write-Host "Prepared $($exe.Name) + cs4fun-Setup.exe"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            apps/app/release/cs4fun-Setup.exe
            apps/app/release/cs4fun-Setup-*.exe
          if-no-files-found: error
          retention-days: 14

  deploy-installer:
    name: Deploy Windows installer
    needs: build-installer
    runs-on: ubuntu-latest
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: installer

      - name: Setup SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?VPS_HOST secret is empty}"
          : "${VPS_PORT:?VPS_PORT secret is empty}"
          : "${VPS_SSH_KEY:?VPS_SSH_KEY secret is empty}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Upload to VPS /download
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          shopt -s nullglob
          files=(installer/cs4fun-Setup.exe installer/cs4fun-Setup-*.exe)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No installer files in artifact" >&2
            ls -laR installer || true
            exit 1
          fi
          scp -i ~/.ssh/deploy_key -P "${VPS_PORT}" -o IdentitiesOnly=yes \
            "${files[@]}" \
            "${VPS_USER}@${VPS_HOST}:/var/www/cs4fun/download/"
