name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy-db:
    name: Apply Supabase migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project & push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          : "${SUPABASE_ACCESS_TOKEN:?Add secret SUPABASE_ACCESS_TOKEN}"
          : "${SUPABASE_DB_PASSWORD:?Add secret SUPABASE_DB_PASSWORD}"
          : "${SUPABASE_PROJECT_REF:?Add secret SUPABASE_PROJECT_REF}"
          # Trim accidental whitespace/newlines from the secret
          PW=$(printf '%s' "$SUPABASE_DB_PASSWORD" | tr -d '\r\n')
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$PW"
          supabase db push --include-all --yes

  deploy-sites:
    name: Build & deploy sites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build landing
        working-directory: apps/web
        env:
          VITE_APP_URL: https://app.cs4fun.online
          VITE_WINDOWS_DOWNLOAD_URL: https://cs4fun.online/download/cs4fun-Setup.exe
        run: npm run build

      - name: Build game
        working-directory: apps/app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Setup SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?VPS_HOST secret is empty}"
          : "${VPS_PORT:?VPS_PORT secret is empty}"
          : "${VPS_SSH_KEY:?VPS_SSH_KEY secret is empty}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Rsync landing
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${VPS_PORT} -o IdentitiesOnly=yes" \
            apps/web/dist/ \
            "${VPS_USER}@${VPS_HOST}:/var/www/cs4fun/web/"

      - name: Rsync game
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${VPS_PORT} -o IdentitiesOnly=yes" \
            apps/app/dist/ \
            "${VPS_USER}@${VPS_HOST}:/var/www/cs4fun/app/"

      - name: Reload nginx
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${VPS_PORT}" -o IdentitiesOnly=yes \
            "${VPS_USER}@${VPS_HOST}" \
            "sudo nginx -t && sudo systemctl reload nginx"

  build-installer:
    name: Build Windows installer
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Bump installer version
        id: bump
        shell: bash
        run: |
          NEXT=$(node scripts/bump-installer-version.mjs)
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Bumped installer version to $NEXT"

      - name: Commit version bump
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/app/package.json package.json
          if git diff --cached --quiet; then
            echo "No version changes to commit"
            exit 0
          fi
          git commit -m "chore: bump installer to ${{ steps.bump.outputs.version }} [skip ci]"
          git push origin HEAD:main

      - name: Build Electron installer
        working-directory: apps/app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run electron:build

      - name: Prepare download artifacts
        shell: pwsh
        run: |
          $release = "apps/app/release"
          $exe = Get-ChildItem $release -File |
            Where-Object { $_.Name -match '(?i)^cs4fun-setup-\d.*\.exe$' } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $exe) { throw "No cs4fun-Setup-*.exe found in $release" }
          # Canonical name: cs4fun-Setup-{version}.exe (Linux nginx is case-sensitive)
          $versionedName = [regex]::Replace($exe.Name, '(?i)^cs4fun-setup-', 'cs4fun-Setup-')
          $versioned = Join-Path $release $versionedName
          if ($exe.FullName -ne $versioned) {
            Move-Item -LiteralPath $exe.FullName -Destination $versioned -Force
          }
          $blockSrc = Join-Path $release ($exe.Name + '.blockmap')
          $blockDest = "$versioned.blockmap"
          if (Test-Path -LiteralPath $blockSrc) {
            Move-Item -LiteralPath $blockSrc -Destination $blockDest -Force
          }
          Copy-Item -LiteralPath $versioned -Destination (Join-Path $release "cs4fun-Setup.exe") -Force
          $yml = Join-Path $release "latest.yml"
          if (-not (Test-Path $yml)) {
            throw "latest.yml missing — electron-builder publish/generic config required for auto-updates"
          }
          $ymlText = [regex]::Replace((Get-Content $yml -Raw), '(?i)cs4fun-setup-', 'cs4fun-Setup-')
          Set-Content -Path $yml -Value $ymlText -NoNewline
          Write-Host "Prepared $versionedName + cs4fun-Setup.exe + latest.yml (v${{ steps.bump.outputs.version }})"
          Get-ChildItem $release | Select-Object Name, Length
          Write-Host "--- latest.yml ---"
          Get-Content $yml
          if (-not (Test-Path -LiteralPath $versioned)) { throw "versioned exe missing: $versionedName" }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            apps/app/release/cs4fun-Setup.exe
            apps/app/release/cs4fun-Setup-*.exe
            apps/app/release/cs4fun-Setup-*.exe.blockmap
            apps/app/release/latest.yml
          if-no-files-found: error
          retention-days: 14

  deploy-installer:
    name: Deploy Windows installer
    needs: build-installer
    runs-on: ubuntu-latest
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: installer

      - name: Setup SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?VPS_HOST secret is empty}"
          : "${VPS_PORT:?VPS_PORT secret is empty}"
          : "${VPS_SSH_KEY:?VPS_SSH_KEY secret is empty}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Upload to VPS /download
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          ls -la installer || true

          # Normalize casing: electron-builder may emit CS4FUN-Setup-* on Windows;
          # Linux nginx is case-sensitive and latest.yml must match the file on disk.
          python3 - <<'PY'
          import pathlib, re, sys
          d = pathlib.Path("installer")
          for p in list(d.iterdir()):
              if not p.is_file():
                  continue
              name = p.name
              m = re.match(r"(?i)^cs4fun-setup(-.+)?$", name)
              if not m:
                  continue
              suffix = m.group(1) or ""
              dest = d / f"cs4fun-Setup{suffix}"
              if p.resolve() != dest.resolve():
                  print(f"normalize {name} -> {dest.name}")
                  p.replace(dest)
          yml = d / "latest.yml"
          if not yml.exists():
              sys.exit("latest.yml missing")
          text = yml.read_text(encoding="utf-8")
          text2 = re.sub(r"(?i)cs4fun-setup-", "cs4fun-Setup-", text)
          yml.write_text(text2, encoding="utf-8")
          print("--- latest.yml ---")
          print(yml.read_text(encoding="utf-8"))
          # Require versioned exe named in yaml (electron-builder nests `url:` under files:)
          m = re.search(r"(?mi)\burl:\s*(\S+)", text2)
          if not m:
              sys.exit("latest.yml missing url:")
          need = d / m.group(1).strip().strip('"').strip("'")
          if not need.is_file():
              print("files:", sorted(x.name for x in d.iterdir()))
              sys.exit(f"missing {need.name} referenced by latest.yml")
          print(f"ok: {need.name} present")
          PY

          upload=(installer/latest.yml)
          for f in installer/cs4fun-Setup.exe installer/cs4fun-Setup-*.exe installer/cs4fun-Setup-*.exe.blockmap; do
            [[ -f "$f" ]] && upload+=("$f")
          done
          echo "Uploading:"
          printf '  %s\n' "${upload[@]}"
          scp -i ~/.ssh/deploy_key -P "${VPS_PORT}" -o IdentitiesOnly=yes \
            "${upload[@]}" \
            "${VPS_USER}@${VPS_HOST}:/var/www/cs4fun/download/"
